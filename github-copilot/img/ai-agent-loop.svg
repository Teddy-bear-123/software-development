<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#333"/>
    </marker>
  </defs>
  <rect width="800" height="460" fill="#ffffff"/>

  <text x="400" y="24" text-anchor="middle" font-size="16" fill="#333">LLM + Tools + Memory + Planning = AI Agent</text>

  <!-- Four ingredient boxes -->
  <rect x="30" y="50" width="160" height="70" rx="8" fill="#f5f5f5" stroke="#8e44ad" stroke-width="2"/>
  <text x="110" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">LLM</text>
  <text x="110" y="98" text-anchor="middle" font-size="11" fill="#333">reasoning / language</text>

  <rect x="220" y="50" width="160" height="70" rx="8" fill="#f5f5f5" stroke="#8e44ad" stroke-width="2"/>
  <text x="300" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Tools</text>
  <text x="300" y="98" text-anchor="middle" font-size="11" fill="#333">run code, call APIs</text>

  <rect x="410" y="50" width="160" height="70" rx="8" fill="#f5f5f5" stroke="#8e44ad" stroke-width="2"/>
  <text x="490" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Memory</text>
  <text x="490" y="98" text-anchor="middle" font-size="11" fill="#333">context across steps</text>

  <rect x="600" y="50" width="170" height="70" rx="8" fill="#f5f5f5" stroke="#8e44ad" stroke-width="2"/>
  <text x="685" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Planning</text>
  <text x="685" y="98" text-anchor="middle" font-size="11" fill="#333">break down tasks</text>

  <!-- converge into agent -->
  <line x1="110" y1="120" x2="330" y2="185" stroke="#333" stroke-width="1.5" marker-end="url(#arrow5)"/>
  <line x1="300" y1="120" x2="360" y2="185" stroke="#333" stroke-width="1.5" marker-end="url(#arrow5)"/>
  <line x1="490" y1="120" x2="440" y2="185" stroke="#333" stroke-width="1.5" marker-end="url(#arrow5)"/>
  <line x1="685" y1="120" x2="470" y2="185" stroke="#333" stroke-width="1.5" marker-end="url(#arrow5)"/>

  <!-- Agent box -->
  <rect x="300" y="190" width="200" height="70" rx="10" fill="#eaf2fb" stroke="#2980b9" stroke-width="2.5"/>
  <text x="400" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">AI Agent</text>
  <text x="400" y="238" text-anchor="middle" font-size="11" fill="#333">acts, observes, repeats</text>

  <!-- Loop down to environment -->
  <line x1="360" y1="260" x2="360" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrow5)"/>
  <text x="330" y="300" text-anchor="end" font-size="11" fill="#555">act</text>

  <line x1="440" y1="330" x2="440" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrow5)"/>
  <text x="470" y="300" text-anchor="start" font-size="11" fill="#555">observe</text>

  <!-- Environment box -->
  <rect x="230" y="330" width="340" height="90" rx="8" fill="#f5f5f5" stroke="#27ae60" stroke-width="2"/>
  <text x="400" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Environment</text>
  <text x="400" y="378" text-anchor="middle" font-size="11" fill="#333">APIs · files · databases · web</text>
  <text x="400" y="396" text-anchor="middle" font-size="11" fill="#333">(e.g. a repo, an issue tracker, a browser)</text>

  <!-- legend -->
  <rect x="30" y="438" width="14" height="14" rx="2" fill="#8e44ad"/>
  <text x="52" y="450" font-size="12" fill="#111">what an agent is built from</text>

  <rect x="280" y="438" width="14" height="14" rx="2" fill="#27ae60"/>
  <text x="302" y="450" font-size="12" fill="#111">what it acts on and learns from</text>
</svg>
