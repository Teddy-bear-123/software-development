<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="520" height="400" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Remote repository -->
  <rect x="60" y="20" width="220" height="70" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="170" y="52" font-size="16" font-weight="700" fill="#1e1b4b" text-anchor="middle">Remote repository</text>
  <text x="170" y="72" font-size="12" fill="#4338ca" text-anchor="middle">(GitHub)</text>

  <!-- fetch arrow -->
  <line x1="170" y1="90" x2="170" y2="156" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="150" y="129" font-size="14" font-weight="700" fill="#334155" text-anchor="end">git fetch</text>

  <!-- Local repository -->
  <rect x="60" y="160" width="220" height="70" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="170" y="192" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Local repository</text>
  <text x="170" y="212" font-size="12" fill="#475569" text-anchor="middle">(.git — commits &amp; refs)</text>

  <!-- merge arrow -->
  <line x1="170" y1="230" x2="170" y2="296" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="150" y="269" font-size="14" font-weight="700" fill="#334155" text-anchor="end">git merge</text>

  <!-- Working copy -->
  <rect x="60" y="300" width="220" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="170" y="332" font-size="16" font-weight="700" fill="#14532d" text-anchor="middle">Working copy</text>
  <text x="170" y="352" font-size="12" fill="#15803d" text-anchor="middle">(the files you edit)</text>

  <!-- pull bracket -->
  <path d="M 300 88 H 320 V 298 H 300" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="332" y="184" font-size="15" font-weight="700" fill="#b91c1c">git pull</text>
  <text x="332" y="202" font-size="12.5" fill="#b91c1c">= git fetch</text>
  <text x="332" y="218" font-size="12.5" fill="#b91c1c">&#160;&#160;+ git merge</text>
</svg>
